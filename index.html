<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oasis Resto Pub | Menú accesible</title><style>:root{font-family:Arial,sans-serif;color:#071936;background:#fff;font-size:20px}body{max-width:850px;margin:auto;padding:22px;line-height:1.55}header{background:#061a40;color:white;padding:24px;border-radius:14px}h1{margin:0}h2{border-bottom:3px solid #1874b9;padding-bottom:5px}button{font:inherit;padding:12px 16px;margin:5px;border:2px solid #071936;border-radius:9px;background:white;color:#071936;cursor:pointer}button:focus-visible{outline:4px solid #ffb300}button[aria-pressed=true]{background:#071936;color:white}.item{padding:14px 0;border-bottom:1px solid #9da9b7}.item strong{font-size:1.12em}.price{font-weight:bold;float:right;margin-left:12px}.desc{display:block;color:#29374c}body.large{font-size:26px}footer{padding:24px 0} .controls{margin:20px 0} @media(max-width:450px){body{padding:12px}.price{float:none;display:block}}</style></head><body><header><h1>OASIS RESTO PUB</h1><p id="subtitle">Carta digital accesible</p></header><nav class="controls" aria-label="Opciones de accesibilidad"><button id="es" aria-pressed="true" lang="es">Español</button><button id="en" aria-pressed="false" lang="en">English</button><button id="large">A+ <span id="largelabel">Letra grande</span></button><button id="listen">🔊 <span id="listenlabel">Escuchar la carta</span></button><button id="stop">■ <span id="stoplabel">Detener audio</span></button></nav><main id="menu"></main><footer id="foot">Precios en pesos uruguayos (UYU). Consultá al personal por alérgenos y opciones sin gluten.</footer><script>
const data=[{es:'Picadas',en:'Sharing platters',items:[['Picada de fiambres','Cold cuts and cheese platter',540,'Queso colonia y magro, jamón, salame, bondiola, aceitunas y pan.','Colonia and low-fat cheese, ham, salami, cured pork, olives and bread.'],['Picada de minutas','Hot snack platter',580,'Papas fritas, papas rústicas, bastones de muzzarella, aros de cebolla y nuggets de pollo. Salsas: alioli, cheddar, picante y barbacoa.','French fries, rustic potatoes, mozzarella sticks, onion rings and chicken nuggets. Sauces: aioli, cheddar, hot sauce and barbecue.']]},{es:'Pizzetas',en:'Small pizzas',items:[['Solo muzzarella','Mozzarella',400],['Con panceta','With bacon',510],['Con jamón','With ham',510],['Con salame','With salami',510],['Con finzeta','With finzeta',510]]},{es:'Postre',en:'Dessert',items:[['Volcán de chocolate','Chocolate lava cake',210]]},{es:'Bebidas sin alcohol',en:'Non-alcoholic drinks',items:[['Línea Coca-Cola','Coca-Cola soft drinks',220,'Coca-Cola, Coca-Cola Zero, Sprite, Fanta.','Coca-Cola, Coca-Cola Zero, Sprite, Fanta.'],['Licuado de frutilla','Strawberry smoothie',300],['Limonada','Lemonade',300,'Jugo de limón, agua, azúcar y hojas de menta.','Lemon juice, water, sugar and mint leaves.'],['Agua mineral','Mineral water',160,'Con o sin gas.','Still or sparkling.']]},{es:'Bebidas con alcohol',en:'Alcoholic drinks',items:[['Cerveza Stella Artois','Stella Artois beer',350],['Cerveza Corona','Corona beer',280],['Fernet','Fernet',300],['Daiquiri de frutilla','Strawberry daiquiri',320],['Jägermeister','Jägermeister',320],['Oasis Blue','Oasis Blue cocktail',320,'Vodka, licor, Sprite, jugo de limón.','Vodka, liqueur, Sprite, lemon juice.']]}];
let lang='es';const $=id=>document.getElementById(id);function render(){document.documentElement.lang=lang;$('subtitle').textContent=lang==='es'?'Carta digital accesible':'Accessible digital menu';$('largelabel').textContent=lang==='es'?'Letra grande':'Large text';$('listenlabel').textContent=lang==='es'?'Escuchar la carta':'Listen to menu';$('stoplabel').textContent=lang==='es'?'Detener audio':'Stop audio';$('foot').textContent=lang==='es'?'Precios en pesos uruguayos (UYU). Consultá al personal por alérgenos y opciones sin gluten.':'Prices in Uruguayan pesos (UYU). Ask staff about allergens and gluten-free options.';$('es').setAttribute('aria-pressed',lang==='es');$('en').setAttribute('aria-pressed',lang==='en');$('menu').replaceChildren();for(const section of data){const s=document.createElement('section'),h=document.createElement('h2');h.textContent=section[lang];s.append(h);for(const i of section.items){const d=document.createElement('div');d.className='item';const p=document.createElement('span');p.className='price';p.textContent='$'+i[2]+' UYU';const b=document.createElement('strong');b.textContent=i[lang==='es'?0:1];d.append(p,b);if(i[lang==='es'?3:4]){const x=document.createElement('span');x.className='desc';x.textContent=i[lang==='es'?3:4];d.append(x)}s.append(d)}$('menu').append(s)}}$('es').onclick=()=>{lang='es';speechSynthesis.cancel();render()};$('en').onclick=()=>{lang='en';speechSynthesis.cancel();render()};$('large').onclick=()=>{document.body.classList.toggle('large');$('large').setAttribute('aria-pressed',document.body.classList.contains('large'))};$('listen').onclick=()=>{if(!('speechSynthesis' in window)){alert(lang==='es'?'Tu navegador no admite lectura en voz alta.':'Text-to-speech is not supported.');return}speechSynthesis.cancel();const t=[...document.querySelectorAll('#menu h2,#menu .item')].map(x=>x.innerText).join('. ');const u=new SpeechSynthesisUtterance(t);u.lang=lang==='es'?'es-UY':'en-US';u.rate=.88;speechSynthesis.speak(u)};$('stop').onclick=()=>speechSynthesis.cancel();render();</script></body></html>
